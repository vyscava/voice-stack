[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dirs.env]
virtual = ".venv"

[project]
name = "voice-stack"
version = "0.1.0"
description = "ASR + TTS services with CUDA/Metal-friendly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vitor Garbim", email = "vyscava@gmail.com" }]
keywords = ["speech-recognition", "whisper", "asr", "webservice"]

# Cross-platform/runtime deps only
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
  "requests",
  "ffmpeg-python"
]

# -----------------------------------------------------------------------------
# torch/torchaudio: three separate mechanisms, do not confuse them.
#
# Which images carry torch at all: ONLY the full (XTTS) image. The slim
# `:kokoro` image (production default) has no torch: ASR
# runs on faster-whisper (CTranslate2) and its VAD is the Silero ONNX model
# that faster-whisper bundles, on onnxruntime. scripts/assert_runtime.py
# --variant kokoro fails the build if torch, torchaudio, whisper, TTS or
# transformers ever come back into that image.
#
#   1. THE PIN (here) fixes the VERSION, exact, because the TTS import path is
#      fragile. The torch 2.13.0 outage (TTS down three days) is now explained:
#      the full image ran Ubuntu 22.04's python3.11, which is
#      3.11.0~rc1 and has no sys.get_int_max_str_digits. Newer torch registers
#      a dynamo polyfill for it behind `sys.version_info >= (3, 11)` (2.9.1
#      used hasattr), so `import torch._dynamo` died right after registering
#      the sys.intern polyfill; transformers swallowed that, and the next
#      import raised the decoy "Duplicate dispatch rule for intern". Pinning
#      2.9.1 hid it. The full image now runs on python:3.11-slim (the same
#      interpreter the venv is built with) and assert_runtime.py refuses a
#      non-final interpreter and imports torch._dynamo directly, first.
#
#   2. THE INDEX (in Dockerfile / Dockerfile.ci / scripts/common-setup.sh) fixes
#      the BUILD VARIANT. `torch==2.15.0` on PyPI is the CUDA wheel: installing
#      it drags in the nvidia-* packages plus triton, gigabytes, for services
#      that run on CPU (compose/deploy/tts.yml pins TTS_DEVICE=cpu). Only
#      --index-url https://download.pytorch.org/whl/cpu gets 2.15.0+cpu. A pin
#      cannot express this; it is not a version, it is a different artifact.
#
#   3. THE ASSERTION (scripts/assert_runtime.py, run by both Dockerfiles) proves
#      the first two actually landed, that torchaudio's ops RUN against this
#      torch, and that torchcodec's extension LOADS -- transformers reports
#      torchcodec availability with importlib.util.find_spec, which is metadata
#      only and passes on a completely unloadable install.
#
# Why the pin has to be `==` rather than a floor: pip's `--upgrade` cannot walk
# BACK from an already-installed CUDA wheel, because by PEP 440 local-version
# ordering 2.13.0+cu130 sorts ABOVE 2.13.0+cpu. That is precisely how the old
# scripts/install_torch.sh managed to do nothing for months -- pyproject
# installed CUDA first, and the script's `--upgrade 'torch>=2.3' --index-url
# .../cpu` saw something "newer" and exited happy.
#
# torchaudio no longer moves in lockstep: 2.11 is its last release (it is in
# maintenance; there is no 2.12+), and coqui-tts still imports it for
# MelSpectrogram and resample. 2.11.0 against torch 2.15.0 is measured, not
# assumed: assert_runtime.py runs exactly those two ops at build time, and the
# smoke stage synthesises through them. If a future torch breaks torchaudio's
# extension it fails there with "Could not load this library:
# _torchaudio.abi3.so", not in production.
#
# torchcodec >= 0.12 builds against torch's stable ABI (its README: torch
# >=2.11), so 0.17 is not tied to one torch minor the way 0.9 was.
#
# Before changing any of these versions: run the TTS import and an XTTS
# synthesis, not just the unit suites. The suites mock torch, so they pass on a
# torch that cannot be imported. The MR pipeline's smoke:image-works does both.
# -----------------------------------------------------------------------------

[project.optional-dependencies]
# Split by feature so you can `pip install .[tts]` on lightweight machines, etc.
# TTS engines are separate extras because each image ships a subset of them:
# the slim CPU image carries Kokoro only (no torch), the full image carries both.
# `tts` stays as the union so existing installs (`.[tts]`) keep working.
tts = [
  "voice-stack[tts-kokoro,tts-xtts]",
]
tts-kokoro = [
  # Pinned for the same reason as torch below: onnxruntime is a compiled
  # extension, and kokoro-onnx's API has moved between minor versions
  # (from_session arrived late). Bump both together and re-run the engine tests.
  "kokoro-onnx==0.6.1",
  "onnxruntime==1.31.1",
  "numpy",
  "soundfile",
]
tts-xtts = [
  # Exact pins: this is the import chain that broke in the torch 2.13 outage. coqui-tts 0.28.0 is
  # the first release written against transformers 5 (its XTTS code carries
  # 5.3 / 5.4 / 5.18 compatibility branches) and only floors it at >=4.57, so
  # transformers is pinned here, not left to float. 5.22.2 clears all six
  # transformers advisories pip-audit reported on 4.57.6.
  "coqui-tts[codec]==0.28.0",
  "transformers==5.22.2",
  "torch==2.15.0",
  "torchaudio==2.11.0",
  # coqui-tts[codec] pulls torchcodec UNPINNED, and it is a compiled extension
  # that must load against this torch and the image's FFmpeg. Like torch it
  # needs the CPU INDEX: PyPI's x86_64 0.17.0 wheel is the CUDA build
  # (libtorchcodec_image.so needs libnvrtc.so.13), so the Dockerfiles install
  # 0.17.0+cpu first. assert_runtime.py asserts +cpu and decodes real audio.
  "torchcodec==0.17.0",
  # coqui-tts imports six (TTS/tts/utils/text/punctuation.py) without
  # declaring it; today langdetect happens to bring it. Declared so dropping
  # langdetect cannot break `from TTS.api import TTS`.
  "six",
  "numpy",
  "soundfile",
  "resampy",
  "langdetect",
]
# Default ASR engine (faster-whisper) and its VAD. No torch: VAD is the Silero
# ONNX model faster-whisper ships, run on onnxruntime (faster-whisper's own
# dependency). This is what the slim image installs.
asr = [
  # Floor: the bundled silero_vad_v6.onnx asset and the VadOptions fields the
  # VAD path passes exist from 1.2.1 (the version the slim image was verified on).
  "faster-whisper>=1.2.1,<2",
  "numpy",
  "soundfile",
  "resampy",
]
# The PyTorch Whisper engine (ASR_ENGINE=whisper). Full image only; it is the
# one ASR feature that needs torch.
asr-whisper = [
  "voice-stack[asr]",
  "openai-whisper",
  "torch==2.15.0",
]
gateway = [
  # The gateway holds no model. It orchestrates the ASR and TTS services over
  # HTTP and reaches the agent fleet over NATS, so its dependencies are a
  # client library and a bus client -- deliberately not torch.
  "httpx>=0.26.0",
  "nats-py>=2.6.0",
  "prometheus-client>=0.20.0",
]
server = [
  "python-dotenv",
  "pydantic-settings",
  "psutil",  # Required for ResourceGuardMiddleware (system resource monitoring)
]
dev = [
  "nox",
  "black",
  "ruff",
  "mypy",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "httpx>=0.26.0",
  "types-requests",
  "types-PyYAML",
  "debugpy",
  "pre-commit",
  "ipdb",
  "aiohttp",   # Required for load testing script
  "aiofiles",  # Required for load testing script
]

[tool.hatch.metadata]
allow-direct-refs = true

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# -----------------------
# Hatch environments
# -----------------------
[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
# gateway included so CI installs the same set the production image does
# (Dockerfile full target: .[server,asr,asr-whisper,tts,gateway]). Without it, any module importing a
# gateway-only dependency passes locally and fails in CI at IMPORT time.
features = ["dev", "server", "tts", "asr", "asr-whisper", "gateway"]
dependencies = []

[tool.hatch.envs.default.scripts]
fmt = [
  "black {root}/src {root}/tests {root}/scripts",
  "ruff check --fix {root}/src {root}/tests {root}/scripts",
]
lint = [
  "black --check {root}/src {root}/tests {root}/scripts",
  "ruff check {root}/src {root}/tests {root}/scripts",
]
typecheck = "mypy {root}/src {root}/scripts"

# Test commands
test = "pytest -v {args:}"
test-fast = "pytest -q --disable-warnings --maxfail=1 {args:}"
test-asr = "pytest tests/unit/asr -v {args:}"
test-tts = "pytest tests/unit/tts -v {args:}"
test-core = "pytest tests/unit/core -v {args:}"
test-utils = "pytest tests/unit/utils -v {args:}"
test-gateway = "pytest tests/unit/gateway -v {args:}"
test-integration = "pytest tests/integration -v {args:}"

# Coverage commands
cov = "pytest --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml {args:}"
cov-asr = "pytest tests/unit/asr --cov=src/asr --cov-report=term-missing {args:}"
cov-tts = "pytest tests/unit/tts --cov=src/tts --cov-report=term-missing {args:}"
cov-gateway = "pytest tests/unit/gateway --cov=src/gateway --cov-report=term-missing {args:}"
cov-report = "coverage report --show-missing {args:}"
cov-html = "coverage html {args:}"

run_asr = "uvicorn asr.app:app --app-dir {root}/src --host 0.0.0.0 --port 5001 --reload --reload-dir {root}/src --log-level info"
run_tts = "uvicorn tts.app:app --app-dir {root}/src --host 0.0.0.0 --port 5002 --reload --reload-dir {root}/src --log-level info"

run_asr_dbg = "python -m debugpy --listen 0.0.0.0:5678 -m uvicorn asr.app:app --app-dir {root}/src --host 0.0.0.0 --port 5001 --log-level debug"
run_tts_dbg = "python -m debugpy --listen 0.0.0.0:5678 -m uvicorn tts.app:app --app-dir {root}/src --host 0.0.0.0 --port 5002 --log-level debug"

smoke = "python -c \"print('Add small smoke tests here')\""

# Production environments (no dev dependencies)
[tool.hatch.envs.prod-asr]
type = "virtual"
path = ".venv-asr"
features = ["server", "asr"]
dependencies = []
[tool.hatch.envs.prod-asr.scripts]
run = "uvicorn asr.app:app --app-dir {root}/src --host 0.0.0.0 --port 5001 --log-level info"

[tool.hatch.envs.prod-tts]
type = "virtual"
path = ".venv-tts"
features = ["server", "tts"]
dependencies = []
[tool.hatch.envs.prod-tts.scripts]
run = "uvicorn tts.app:app --app-dir {root}/src --host 0.0.0.0 --port 5002 --log-level info"

[tool.hatch.envs.test]
type = "virtual"
path = ".venv-test"
features = []
dependencies = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
[tool.hatch.envs.test.scripts]
run = "pytest -q --disable-warnings --maxfail=1"
cov = "pytest --cov=src --cov-report=term-missing"

[tool.hatch.envs.typecheck]
type = "virtual"
path = ".venv-tycheck"
skip-install = true
features = []
dependencies = ["mypy>=1.10.0", "types-requests", "types-PyYAML"]
[tool.hatch.envs.typecheck.scripts]
run = "mypy src"

[tool.hatch.envs.lint]
type = "virtual"
path = ".venv-lint"
skip-install = true
features = []
dependencies = ["ruff>=0.5.0"]
[tool.hatch.envs.lint.scripts]
run =[
  "black --check {root}/src {root}tests",
  "ruff check {root}/src {root}tests",
  "mypy {root}/src"
]

[tool.hatch.envs.fmt]
type = "virtual"
path = ".venv-fmt"
skip-install = true
features = []
dependencies = ["black>=24.4.0", "ruff>=0.5.0"]
[tool.hatch.envs.fmt.scripts]
run = [
  "black {root}/src/*.py {root}/tests/*.py {root}/scripts/*.py",
  "ruff check --fix {root}/src {root}/tests {root}/scripts",
]

# -----------------------
# Ruff
# -----------------------
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".nox", ".venv", "venv"]

[tool.ruff.lint.isort]
known-first-party = ["asr", "app", "core", "tts"]
known-third-party = ["TTS"]

[tool.ruff.lint]
select = [
  "E", "F",       # pycodestyle/pyflakes
  "I",            # import sorting (used in fmt step)
  "UP",           # pyupgrade
  "B",            # bugbear
  "C4",           # comprehensions
  "PIE",          # misc correctness
  "PERF",         # performance
]
ignore = [
  # Add rule codes to ignore if needed
  "B008", # do not perform function calls in argument defaults
  "C901", # too complex
  #"UP006", # do not use typing (mypy) use annotations
]

# Use the new unified Ruff formatter only if you decide to drop Black entirely.
# [tool.ruff.format]
# docstring-code-format = true

# -----------------------
# Black
# -----------------------
[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "build|dist|.nox|.venv|venv"

# -----------------------
# MyPy
# -----------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict_equality = true
pretty = true
show_column_numbers = true
show_error_codes = true
ignore_missing_imports = true

# Per-module relaxation is handy while migrating:
[[tool.mypy.overrides]]
module = [
  "ffmpeg.*",
  "torch.*",
  "resampy.*",
  "soundfile.*",
  "numpy.*",
  "faster_whisper.*"
]
ignore_missing_imports = true

# -----------------------
# Pytest
# -----------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow running tests",
  "asr: ASR service tests",
  "tts: TTS service tests",
  "requires_gpu: Tests that require GPU",
  "requires_models: Tests that require model downloads",
]
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning",
]
asyncio_mode = "auto"

# -----------------------
# Coverage
# -----------------------
[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/venv/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
