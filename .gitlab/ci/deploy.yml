# Deploys: one include of a shared compose deployer template per stack. A
# merge to main IS the deploy. Each job talks to the deploy host over an SSH
# docker context, pins the image build:prod-image pushed in this pipeline
# (the slim image; the full one for streaming ASR), runs `compose up -d` under the stack's project name,
# and asserts the running digest, state and health before it goes green. A
# failed deploy that touched the host writes a hold; the next deploy of that
# stack refuses until it is cleared.
#
# The deploy stage comes after release, and these jobs have no `needs` (the
# gateway's are below), so every gate in the pipeline (tests, smoke, security
# scans, the :kokoro promotion) must be green before anything reaches the host.
#
# Where to deploy is configuration, not code: the host comes from the
# DEPLOY_HOST CI/CD variable (the template's fallback when `host` is empty) and
# the image repository from DOCKER_REGISTRY. These jobs run on the default
# branch only; a fork that does not deploy sets DEPLOY_DISABLED=true.
#
# `stack` is the compose project name on the host and the docker context name.
#
# prune_before_pull: each deploy pulls multi-GB images, and several deploys in
# one day fill the host before its own image prune runs, so a pull fails
# mid-extract. The template first removes this repository's superseded images
# (unused, older than an hour; never volumes or another project's images).

include:
  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-asr
      compose_file: compose/deploy/asr.yml
      image_var: VOICE_STACK_IMAGE
      published_var: VOICE_STACK_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      ci_fallback: false
      prune_before_pull: true
      health_timeout: 420
  # Streaming ASR (/v1/stream) on the full image: it needs torch, which the
  # slim image leaves out by design. Its own stack, so the model's memory and
  # CPU threads never starve batch ASR, which stays the agent's fallback.
  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-asr-stream
      compose_file: compose/deploy/asr-stream.yml
      image_var: VOICE_STACK_FULL_IMAGE
      published_var: VOICE_STACK_FULL_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      ci_fallback: false
      prune_before_pull: true
      health_timeout: 300
  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-tts
      compose_file: compose/deploy/tts.yml
      image_var: VOICE_STACK_IMAGE
      published_var: VOICE_STACK_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      ci_fallback: false
      prune_before_pull: true
      health_timeout: 300
  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-gateway
      compose_file: compose/deploy/gateway.yml
      image_var: VOICE_STACK_IMAGE
      published_var: VOICE_STACK_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      ci_fallback: false
      prune_before_pull: true

  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-agent
      compose_file: compose/deploy/agent.yml
      image_var: VOICE_STACK_AGENT_IMAGE
      published_var: VOICE_AGENT_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      ci_fallback: false
      prune_before_pull: true
  # GPU batch ASR on its own host: the asr-cuda image (faster-whisper on CUDA
  # 12). The host comes from the VOICE_STACK_GPU_DEPLOY_HOST CI/CD variable, so
  # a fork without a GPU host leaves it unset and sets DEPLOY_DISABLED, as for
  # every other stack. Nothing depends on it: the CPU ASR stays the fallback.
  - project: gitops/ci-templates
    ref: v1.4.0
    file: /templates/deploy.yml
    inputs:
      stack: voice-stack-asr-gpu
      compose_file: compose/deploy/asr-gpu.yml
      image_var: VOICE_STACK_ASR_CUDA_IMAGE
      published_var: VOICE_STACK_ASR_CUDA_PUBLISHED_IMAGE
      image_repository: $DOCKER_REGISTRY/voice-stack
      host: $VOICE_STACK_GPU_DEPLOY_HOST
      ci_fallback: false
      prune_before_pull: true
      health_timeout: 420

# The gateway joins the ASR and TTS networks as external networks, which only
# exist once those stacks are up, so it deploys after both. A job with `needs`
# only receives the dotenv of the jobs it names, hence build:prod-image (the
# pinned image) and release:latest (which keeps every gate upstream of it).
deploy:voice-stack-gateway:
  needs:
    - build:prod-image
    - release:latest
    - deploy:voice-stack-asr
    - deploy:voice-stack-tts

# It joins the ASR stack's network as an external network.
deploy:voice-stack-asr-stream:
  needs:
    - build:prod-image
    - release:latest
    - deploy:voice-stack-asr

# The agent joins the same two networks, so it deploys after both as well.
# Not after voice-stack-asr-stream: the agent falls back to batch ASR when the
# stream is down, so a failed stream deploy must not hold the agent back.
deploy:voice-stack-agent:
  needs:
    - build:prod-image
    - release:latest
    - deploy:voice-stack-asr
    - deploy:voice-stack-tts

# An unset VOICE_STACK_GPU_DEPLOY_HOST would make the deployer fall back to
# DEPLOY_HOST, the CPU host, where the GPU service cannot start. Fail loudly
# instead (the template leaves before_script empty for exactly this kind of
# per-stack guard).
deploy:voice-stack-asr-gpu:
  before_script:
    - '[ -n "${VOICE_STACK_GPU_DEPLOY_HOST:-}" ] || { echo "FAIL: VOICE_STACK_GPU_DEPLOY_HOST is not set; refusing to fall back to DEPLOY_HOST"; exit 1; }'
