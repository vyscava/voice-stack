# ============================================================================
# GPU images (docker/Dockerfile.cuda, docker/Dockerfile.rocm): check + publish
# ============================================================================
# Included from .gitlab-ci.yml. The GPU images exist for running voice-stack on
# NVIDIA or AMD hardware. The deploy jobs in this pipeline use the slim CPU
# :kokoro image, so no deploy uses them. Every job here:
#
#   - BUILDS the image (which runs scripts/assert_runtime.py --variant cuda|rocm)
#   - pip-audits and trivies it with the same pins and policy as the CPU gates
#     (ci/gpu-image-check.sh)
#   - and DELETES it at the end (after_script, also on failure or cancel)
#
# TWO KINDS OF JOB
#   build:gpu-image:*    merge requests. Check only: no registry login, no push.
#   publish:gpu-image:*  main, after the deploy. The same check, then the image
#                        that passed it is pushed as
#                        ${DOCKER_REGISTRY}/voice-stack:cuda / :rocm
#                        (ci/gpu-image-publish.sh, moving tags only).
#
# WHY PUBLISH SITS AFTER THE DEPLOY. The deploy jobs have no `needs`, so they
# wait for every job in an earlier stage. A GPU build in any stage before
# `deploy` would hold every production deploy for ~20 minutes, and stop it if
# it failed. The `publish` stage comes after `deploy`, and the publish jobs
# have no `needs` either, so they start only once the deploy is done (and not
# at all if it failed), and they are allow_failure: a red GPU build marks the
# pipeline with a warning but cannot undo or block anything.
#
# WHEN THEY RUN
#   merge requests that change what goes into the image: build, automatically
#   any other merge request: build, manual (play it to rebuild on demand)
#   main: publish, MANUAL only (play the job to publish). Each publish is two
#     cold ~20-minute builds and ~20 GB of pushes, and src/ is an image input,
#     so publishing on every merge costs more runner time than it is worth.
#     The automatic rules are kept below, commented out, to turn back on.
#   scheduled pipelines: build, automatically (none is configured; a schedule
#     on main would also run the deploy jobs, which do not exclude schedules)
#
# Nothing on the runner has a GPU. These jobs prove the images BUILD and are
# the GPU builds they claim to be. Inference was verified by hand on an
# RTX 5090 and on an AMD Radeon 8060S (gfx1151) on 2026-11-12.
#
# DISK. The runner is one shared docker daemon on one disk, and these builds
# are big (images 9-12 GB, builder stages as large again). The first version
# built on the daemon's default builder and kept its layer cache: two
# pipelines left ~110 GB and filled the disk, failing every project's CI. So:
#   - each build runs in a throwaway docker-container builder whose cache is
#     deleted with it (ci/gpu-image-check.sh), and the image is removed after;
#   - resource_group gpu-image-build runs ONE GPU build at a time across all
#     pipelines, so the peak is one build (~50 GB for ROCm), not several;
#   - cleanup:gpu-build-cache (manual) removes cache left by builds made
#     before this, or by a job killed before its after_script ran.
# Names carry ${CI_JOB_ID} so concurrent jobs cannot collide.
# ============================================================================

# What every GPU job shares: one build at a time, a throwaway builder, and
# cleanup of everything the job created.
.gpu-image-base:
  image: docker:29
  before_script: []
  timeout: 3 hours
  resource_group: gpu-image-build
  variables:
    GPU_IMAGE: "voice-stack-gpu-${GPU_VARIANT}:job-${CI_JOB_ID}"
    GPU_BUILDER: "gpu-${GPU_VARIANT}-${CI_JOB_ID}"
  script:
    - sh ci/gpu-image-check.sh "$GPU_VARIANT"
  after_script:
    - docker rm -f "freeze-${GPU_VARIANT}-${CI_JOB_ID}" "meta-${GPU_VARIANT}-${CI_JOB_ID}" "trivy-${GPU_VARIANT}-${CI_JOB_ID}" "audit-${GPU_VARIANT}-${CI_JOB_ID}-report" "audit-${GPU_VARIANT}-${CI_JOB_ID}-gate" >/dev/null 2>&1 || true
    - docker buildx rm -f "$GPU_BUILDER" || true
    - docker rmi -f "$GPU_IMAGE" || true
    - '[ -z "${DOCKER_REGISTRY:-}" ] || docker rmi -f "${DOCKER_REGISTRY}/voice-stack:${GPU_VARIANT}" || true'
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gpu-image-metrics.txt
      - requirements.freeze.txt
      - pip-audit-all.json
      - trivy-report.json
  tags:
    - docker
    - nuc

# Merge-request check. Stage `security` with `needs: []`: the job still starts
# at once, but jobs in EARLIER stages (quality, test, smoke) never wait for it.
# In build-images, a 15-minute GPU build held up the whole MR pipeline.
.gpu-image:
  extends: .gpu-image-base
  stage: security
  needs: []

# Publish on main. No `needs`: stage order puts it after deploy (see above).
.gpu-image-publish:
  extends: .gpu-image-base
  stage: publish
  allow_failure: true
  script:
    - sh ci/gpu-image-check.sh "$GPU_VARIANT"
    - sh ci/gpu-image-publish.sh "$GPU_VARIANT"
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gpu-image-metrics.txt
      - gpu-image-published.txt
      - gpu-image-push.log
      - requirements.freeze.txt
      - pip-audit-all.json
      - trivy-report.json

# The shared inputs of both images. Each job adds its own Dockerfile.
.gpu-image-inputs: &gpu-image-inputs
  - pyproject.toml
  - src/**/*
  - scripts/assert_runtime.py
  - scripts/accept_coqui_license.sh
  - scripts/entrypoint.sh
  - scripts/.env.production.*
  - ci/gpu-image-check.sh
  - ci/gpu-image-publish.sh
  - ci/trivy-guard.tpl
  - .gitlab/ci/gpu-images.yml

build:gpu-image:cuda:
  extends: .gpu-image
  variables:
    GPU_VARIANT: cuda
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docker/Dockerfile.cuda
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *gpu-image-inputs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

build:gpu-image:rocm:
  extends: .gpu-image
  variables:
    GPU_VARIANT: rocm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docker/Dockerfile.rocm
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *gpu-image-inputs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

publish:gpu-image:cuda:
  extends: .gpu-image-publish
  variables:
    GPU_VARIANT: cuda
  rules:
    # Automatic publish on a push to main that changes an image input. Off: see
    # WHEN THEY RUN above. Uncomment to publish on every such merge.
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    #   changes:
    #     - docker/Dockerfile.cuda
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    #   changes: *gpu-image-inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual

publish:gpu-image:rocm:
  extends: .gpu-image-publish
  variables:
    GPU_VARIANT: rocm
  rules:
    # Automatic publish on a push to main that changes an image input. Off: see
    # WHEN THEY RUN above. Uncomment to publish on every such merge.
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    #   changes:
    #     - docker/Dockerfile.rocm
    # - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    #   changes: *gpu-image-inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual

# Manual: remove GPU-build cache left on the daemon's default builder (see the
# DISK note above). Dry-run listing first, then the prune; scoped to records
# only these Dockerfiles create (ci/gpu-cache-prune.sh says how).
cleanup:gpu-build-cache:
  stage: security
  image: docker:29
  needs: []
  # Never alongside a GPU build: it removes builders it assumes are orphaned.
  resource_group: gpu-image-build
  before_script: []
  variables:
    GIT_DEPTH: "1"
  script:
    - sh ci/gpu-cache-prune.sh
    - sh ci/gpu-cache-prune.sh --apply
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gpu-cache-records.txt
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  tags:
    - docker
    - nuc
