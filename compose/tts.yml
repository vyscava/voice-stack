# Voice Stack TTS (Portainer Production Stack)
# Deployed on openwebui host (openwebui.server.local.vitorgarbim.me, 10.87.2.15). CPU inference, no GPU.
#
# Runs on CPU to free the RTX 3060 VRAM for the kb-face service.
# Coqui XTTS-v2 runs on CPU (slower than GPU but functional); TTS_DEVICE is
# pinned to cpu so the app does not attempt CUDA.
#
# Portainer config:
#   Repository: https://gitlab.vitorgarbim.me/data-platforms/voice-stack.git
#   Compose path: compose/tts.yml
#   Environment: openwebui (openwebui.server.local.vitorgarbim.me)

services:
  tts:
    # VOICE_STACK_TAG picks the image: kokoro (slim CPU: ASR + Kokoro + gateway)
    # or latest / xtts (full: both TTS engines). Unset keeps latest.
    image: registry.local.vitorgarbim.me/voice-stack:${VOICE_STACK_TAG:-latest}
    container_name: voice-stack-tts
    restart: unless-stopped

    environment:
      SERVICE_MODE: tts
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      HOST: ${HOST}
      TTS_PORT: ${TTS_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUGPY_ENABLE: ${DEBUGPY_ENABLE}
      TTS_ENGINE: ${TTS_ENGINE}
      # CPU inference: device pinned to cpu so the app does not attempt CUDA.
      TTS_DEVICE: cpu
      TTS_MODEL: ${TTS_MODEL}
      TTS_VOICES_DIR: ${TTS_VOICES_DIR}
      # Engine-specific settings. Defaults here so a stack env that predates
      # them still deploys.
      TTS_KOKORO_MODEL_PATH: ${TTS_KOKORO_MODEL_PATH:-/app/models/kokoro/kokoro-v1.0.onnx}
      TTS_KOKORO_VOICES_PATH: ${TTS_KOKORO_VOICES_PATH:-/app/models/kokoro/voices-v1.0.bin}
      TTS_KOKORO_DEFAULT_VOICE: ${TTS_KOKORO_DEFAULT_VOICE:-af_heart}
      TTS_KOKORO_THREADS: ${TTS_KOKORO_THREADS:-0}
      TTS_XTTS_DEFAULT_VOICE: ${TTS_XTTS_DEFAULT_VOICE:-Claribel Dervla}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE}
      TTS_MAX_CHARS: ${TTS_MAX_CHARS}
      TTS_MIN_CHARS: ${TTS_MIN_CHARS}
      TTS_RETRY_STEPS: ${TTS_RETRY_STEPS}
      TTS_DEFAULT_LANG: ${TTS_DEFAULT_LANG}
      TTS_AUTO_LANG: ${TTS_AUTO_LANG}
      TTS_IDLE_TIMEOUT_MINUTES: ${TTS_IDLE_TIMEOUT_MINUTES}
      TTS_MAX_CONCURRENT_REQUESTS: ${TTS_MAX_CONCURRENT_REQUESTS}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}

    ports:
      - "5002:5002"

    volumes:
      - tts-models:/home/voicestack/.local/share/tts
      - tts-voices:/app/voices

    dns:
      - 10.87.2.4

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 8G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tts-models:
    driver: local
  tts-voices:
    driver: local
