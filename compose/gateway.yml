# Voice Stack Gateway (Portainer Production Stack)
# Deployed on the openwebui host, alongside the ASR and TTS stacks.
#
# Holds no model. It calls the ASR and TTS services over HTTP and asks an agent
# on the NATS bus for the answer, so it is a small, fast-starting process that
# can be restarted freely without evicting anyone's model cache.
#
# Portainer config:
#   Repository:   https://gitlab.vitorgarbim.me/data-platforms/voice-stack.git
#   Compose path: compose/gateway.yml
#   Environment:  openwebui
#
# NETWORKS. The ASR and TTS stacks each create their own network, so this
# service joins BOTH as external networks in order to address them by container
# name. Reaching them by host IP instead would work until an address changed;
# names do not move.
#
# NATS lives on a different host, reached over the LAN by hostname on 4222.

services:
  gateway:
    image: registry.local.vitorgarbim.me/voice-stack:latest
    container_name: voice-stack-gateway
    restart: unless-stopped

    environment:
      SERVICE_MODE: gateway
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      HOST: ${HOST}
      GATEWAY_PORT: ${GATEWAY_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUGPY_ENABLE: ${DEBUGPY_ENABLE}

      # Container names on the joined networks, not addresses.
      GATEWAY_ASR_URL: ${GATEWAY_ASR_URL}
      GATEWAY_TTS_URL: ${GATEWAY_TTS_URL}

      # GATEWAY_SELF_NAME must match this service's identity on the bus exactly.
      # Publishing is only permitted under agents.<self>.>, and a mismatch is
      # rejected asynchronously: the send reports success and the message never
      # arrives.
      GATEWAY_SELF_NAME: ${GATEWAY_SELF_NAME}
      GATEWAY_AGENT: ${GATEWAY_AGENT}
      GATEWAY_NATS_URL: ${GATEWAY_NATS_URL}
      GATEWAY_NATS_TOPIC: ${GATEWAY_NATS_TOPIC}

      GATEWAY_AGENT_TIMEOUT_S: ${GATEWAY_AGENT_TIMEOUT_S}
      GATEWAY_ASR_TIMEOUT_S: ${GATEWAY_ASR_TIMEOUT_S}
      GATEWAY_TTS_TIMEOUT_S: ${GATEWAY_TTS_TIMEOUT_S}

      # A stock speaker. Cloned voices of real people stay private, and a
      # default must never leak one by accident.
      GATEWAY_VOICE: ${GATEWAY_VOICE}
      GATEWAY_AUDIO_FORMAT: ${GATEWAY_AUDIO_FORMAT}
      GATEWAY_MIN_TRANSCRIPT_CHARS: ${GATEWAY_MIN_TRANSCRIPT_CHARS}

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}

    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"

    # Internal resolver, so nats.local.* and other internal names resolve.
    # A variable rather than a literal: the resolver's address is not this
    # service's business, and a hardcoded one is wrong the day it moves.
    dns:
      - ${DNS_RESOLVER}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GATEWAY_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # No model to load, so it is up in seconds rather than minutes.
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - asr
      - tts

networks:
  asr:
    external: true
    name: voice-stack-asr_default
  tts:
    external: true
    name: voice-stack-tts_default
